# Cost Dashboard load test — scenarios/api/cost_dashboard/locustfile.py
# Relative paths resolve against this file's directory.

api:
  # Or `env: stg1` (see mcperf/core/environments.py); --env on the command line wins.
  base_url: "https://stg1-api.montycloud.com"
  # Sent as MC_DEBUG_MODE in every signin payload (bypasses CAPTCHA checks).
  mc_debug_mode: true
  timeout_seconds: 40

load:
  # Users CSV shared by all API scenarios (gitignored; copy ../users.csv.example).
  users_csv: "../users.csv"
  # Rows loaded from users_csv (first N). Keep >= Locust --users.
  user_count: 1
  # single_journey: each user runs `iterations` journeys, then the test stops.
  # timed: users loop until --run-time.
  run_mode: "single_journey"
  iterations: 5
  # Pause (seconds) between sign-in and the Cost Dashboard flow.
  think_time_min: 2
  think_time_max: 5
  # Pause (seconds) after Batch 1 (bootstrap) and Batch 3 (tag-keys).
  batch_think_time_min: 3
  batch_think_time_max: 4

report:
  # Report file: custom_<report_name>_<timestamp>.html, next to the --csv output.
  report_name: "cost_dashboard"
  description: |
    Cost Dashboard API Performance Test
    Standalone flow: Signin -> Cost Dashboard (bootstrap, Total Spend x date
    ranges, tag-keys lookup, Spend Trend tab x date ranges).

cost_dashboard:
  # Pause (seconds) after each date-range preset (user picks a new range or tab).
  preset_think_time_min: 1
  preset_think_time_max: 3

  # Send ChargeTypes.exclude=[Credit,Refund] on every preset pass. The optional
  # first unfiltered pass never sends it, matching the HAR capture.
  charge_types_exclude: true

  # Fire Batch 2 once without the ChargeTypes filter first, as the HAR shows,
  # covering `default_days_back` days.
  include_no_filter_pass: true
  default_days_back: 40

  # Date ranges cycled every iteration: StartDate = today - days_back, EndDate = today.
  # Matches the 6 ranges in the HAR (2y/1y/6m/3m/30d/7d).
  date_range_presets:
    - label: "2y"
      days_back: 730
    - label: "1y"
      days_back: 365
    - label: "6m"
      days_back: 183
    - label: "3m"
      days_back: 91
    - label: "30d"
      days_back: 30
    - label: "7d"
      days_back: 7

  # Batch 3 tag-keys lookup page size.
  tag_keys_limit: 20
  # Batch 4 spend-breakdown-summary / resource-count page size.
  breakdown_limit: 25
