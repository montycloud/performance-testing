# Inventory summary load test — scenarios/api/inventory/locustfile.py
# Relative paths resolve against this file's directory.

api:
  base_url: "https://stg1-api.montycloud.com"
  mc_debug_mode: true
  timeout_seconds: 40

load:
  # Users CSV shared by all API scenarios (gitignored; copy users.csv.example).
  users_csv: "../users.csv"
  # Rows loaded from users_csv (first N). Keep >= Locust --users, otherwise
  # credentials are recycled round-robin and users share accounts.
  user_count: 4
  # single_journey: each user runs `iterations` journeys, then the test stops.
  # timed: users loop until --run-time.
  run_mode: "single_journey"
  iterations: 1
  # Pause (seconds) between sign-in and the Inventory batch.
  think_time_min: 2
  think_time_max: 5
  # Pause (seconds) after the Inventory batch.
  batch_think_time_min: 1
  batch_think_time_max: 3

report:
  # Report file: custom_<report_name>_<timestamp>.html, next to the --csv output.
  report_name: "inventory"
  description: |
    Inventory API Performance Test
    Standalone flow: Signin -> Batch A (resources + Inventory Summary
    by-account/by-region/by-resourcetype + resource-governance-summary,
    parallel) -> [Batch B (filtered Inventory Summary) -> Batch C (unfiltered
    Inventory Summary + resource-governance-summary), once per configured
    filter_resource_types entry] -> Batch D (sequential resources_paginated
    drilldowns).

inventory:
  # Sent as CloudProvider on every call below.
  cloud_provider: "AWS"

  # Batch A — initial page load: GET /org/resources + the 3 summary calls +
  # GET /org/resource-governance-summary, all in parallel. Set false to skip
  # straight to the summary trio only (pre-Batch-A behavior).
  batch_a_enabled: true
  # Sent as Filters.ResourceType on the Batch A GET /org/resources call.
  batch_a_org_resource_type: "CustomerAccount"

  # SummaryType values fired in parallel in Batch A/B/C.
  summary_types:
    - "by-account"
    - "by-region"
    - "by-resourcetype"

  # Batch B/C — filter apply/clear cycle. One (Batch B: filtered summary trio,
  # Batch C: unfiltered summary trio + governance-summary) pair runs per entry
  # here, in order, every iteration. Empty/omitted: Batch B/C is skipped
  # entirely and the journey goes straight from Batch A to Batch D.
  filter_resource_types:
    - "API"
    - "Snapshot"

  # Batch D — sequential GET /org/resources_paginated drilldowns, one call per
  # entry, in order, with a randomized pause (drilldown_think_time_*) between
  # each. `type` is required; `limit`, `offset` and `cloud_provider` are
  # optional per entry (sent only when present).
  drilldown_resource_types:
    - type: "Instance"
      limit: 10
    - type: "Image"
      limit: 10
    - type: "Workspace"
      cloud_provider: "AWS"
      offset: 0
      limit: 100
    - type: "NotebookInstance"
      cloud_provider: "AWS"
      offset: 0
      limit: 100
    - type: "Volume"
      limit: 10
    - type: "Snapshot"
      limit: 10
    - type: "S3"
      limit: 10
  # Pause (seconds) between each Batch D drilldown call.
  drilldown_think_time_min: 2
  drilldown_think_time_max: 10
