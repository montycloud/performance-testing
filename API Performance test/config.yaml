api:
  # Base URL of the MontyCloud API (no trailing slash)
  base_url: "https://stg1-api.montycloud.com"
  # Pass MC_DEBUG_MODE=true in every signin payload (bypasses CAPTCHA checks)
  mc_debug_mode: true
  # Per-request timeout in seconds
  timeout_seconds: 40

test:
  # Path to the users CSV file (relative to this config file, or absolute)
  # CSV must have columns: Name, Email, Password, New Password
  # The test signs in with Email + "New Password" (permanent password post-reset)
  users_csv: "./users.csv"

  # How many users to load from the CSV (first N rows).
  # Locust --users controls concurrency; user_count controls which credentials are used.
  # Example: user_count=10 + --users 10  → 10 unique users, each gets a unique credential
  #          user_count=10 + --users 20  → 10 credentials recycled round-robin at 20 concurrency
  user_count: 1

  # Default spawn rate (users/second). Override via locust --spawn-rate N
  spawn_rate: 1

  # Default run time. Override via locust --run-time <value>
  run_time: "5m"

  # Run mode controls how long virtual users stay active:
  #
  #   single_journey  – each user completes `iterations` full journeys
  #                     (Home Page + WAFR) then stops. No new user is spawned
  #                     in its place. Test exits automatically when all users
  #                     have finished. Use this with --users N (no --run-time
  #                     needed).
  #
  #   timed           – users loop continuously until --run-time expires.
  #                     Use this with --users N --run-time <duration>.
  #                     `iterations` is ignored in this mode.
  #
  run_mode: "single_journey"

  # Human-readable description of this test run (appears at the top of the HTML report).
  # Describe the scenario: e.g. number of users, iterations, what is being measured.
  description: |
     AI Conversation Chat
     Total Users 1
     Tenants 3  ( MSP ,Tenant 1 and Tenant 2 )
     Query: Get the Critical and High Severity finding counts for the Sustainability pillar across all assessments in selected Tenant's,
            including both InProgress and Completed assessments
  # Mode : Single User Journey
  # Email:  Perf Test User 59,perftestuser59@montycloud.com,Tenant 4
  #         Perf Test User 63,perftestuser63@montycloud.com,Tenant 5
  #         Perf Test User 67,perftestuser67@montycloud.com,Tenant 6
  #         Perf Test User 71,perftestuser71@montycloud.com,Tenant 7
  # Tenant: There are 4 tenants each having 1 users  accesing it and each tenant has 2 AWS accounts
  # No Org account in this TEST
  # 1 WAFR scan each account with approx 4LAC findings
  # Test with 4 users to find the API gateway timeout 
    
  # Name used in the custom report filename: custom_<report_name>_<timestamp>.html
  # Use snake_case or hyphens; avoid spaces. Leave blank to use default "report".

  report_name: "report_AI_Chat_User_1_Tenants_3_Medium_Query_run_2"
  # Number of full journeys each user completes in single_journey mode
  # before stopping. Example: --users 1 + iterations: 20 → one user runs
  # the journey 20 times back-to-back. Ignored in timed mode.
  iterations: 1

  # Think time (seconds) between the Home Page and WAFR Page flows.
  # Each iteration sleeps a random duration in [think_time_min, think_time_max].
  # Set both to 0 to disable think time entirely.
  think_time_min: 2
  think_time_max: 5

  # Think time (seconds) between batches *within* the WAFR page.
  # Typically shorter than the page-transition think time.
  # Defaults to think_time_min / think_time_max if not set.
  wafr_think_time_min: 1
  wafr_think_time_max: 3

# Health Events flow (added after Home Page/WAFR in the journey, or run
# standalone). Uses the same `think_time_min`/`think_time_max` above for
# the pause before Health calls start.
health:
  # false (default) = Health Events calls never run; behaviour is identical
  # to before this feature was added.
  enabled: false

  # mode controls how the Health Events flow fits into the user journey:
  #
  #   appended    – Signin -> Home Page -> WAFR -> think time -> Health.
  #                 The existing full journey, with Health tacked on at the end.
  #
  #   standalone  – Signin -> think time -> Health only.
  #                 Skips Home Page and WAFR entirely for this run.
  #
  mode: "standalone"

# Chat flow (WebSocket-based AI chat bot). Uses the same `think_time_min`/
# `think_time_max` above for the pause before the chat call starts.
#
# NOTE: each chat call currently opens ONE WebSocket connection and sends
# exactly ONE query, then closes (see WEBSOCKET_CHAT_APPROACH.md — multi-turn
# conversations on a single connection are deferred). `test.iterations` still
# controls how many times the whole journey (including a fresh chat call)
# repeats in single_journey mode, same as it does for Home Page/WAFR/Health.
chat:
  # false (default) = Chat flow never runs; behaviour is identical to before
  # this feature was added.
  enabled: true

  # mode controls how the Chat flow fits into the user journey:
  #
  #   appended    – Signin -> Home Page -> WAFR -> (Health) -> think time -> Chat.
  #   standalone  – Signin -> think time -> Chat only.
  #                 Skips Home Page, WAFR, and Health entirely for this run.
  #
  mode: "standalone"

  # WebSocket endpoint (no trailing slash). Authorization/OrganizationId/
  # agentic query params are appended automatically. OrganizationId here is
  # the signed-in user's own org (self._org_id, fetched via /auth/user) —
  # unrelated to the per-tenant lookup below used for the message body.
  # e.g. "wss://fw6ru70i23.execute-api.us-east-2.amazonaws.com/stg1"
  ws_base_url: "wss://fw6ru70i23.execute-api.us-east-2.amazonaws.com/stg1"

  # Path to the chat queries file (relative to this config file, or absolute).
  # One query per line; a random line is picked for each chat call.
  queries_file: "./chat_queries.txt"

  # Path to a JSON file listing tenants: [{"ID": "...", "Name": "...", ...}, ...]
  # Used to build the outgoing message's `tenant_scope`. Each user's `Tenant`
  # column value in users.csv is matched EXACTLY against an entry's `Name`
  # here to find the tenant-specific org id (`ID`). If no match is found, the
  # chat call is skipped for that user and an error is logged (no fallback).
  tenants_file: "./Tenant.json"

  # Metadata sent with every query.
  model_id: ""
  temperature: 0.1
  top_p: 1
  top_k: 250

  # Overall deadline (seconds) to wait for the PROMPT_STATUS "ENDED" frame
  # before marking the chat call as failed (timeout).
  timeout_seconds: 600

  # Optional: path to a per-message transcript log (relative to this config
  # file, or absolute). Every frame sent/received on the WebSocket is
  # appended here with a timestamp and elapsed time since the query was
  # sent — useful for debugging response pacing/content during a run.
  # Leave blank ("") to disable (only the summary lines already logged via
  # the normal logger will be shown/captured by Locust's --logfile).
  transcript_log: "./reports/chat_transcript.log"

